<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Tracker — Modern</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    :root {
      --bg-deep: #05070c;
      --bg-surface: #0b1017;
      --bg-elevated: #111823;
      --border-subtle: #1c2a3f;
      --border-strong: #2a4a7f;
      --blue-accent: #3b82f6;
      --blue-bright: #60a5fa;
      --blue-deep: #1e3a8a;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --danger: #ef4444;
      --danger-deep: #7f1d1d;
      --success: #22c55e;
    }

    body {
      background: var(--bg-deep);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 1080px;
      width: 100%;
      background: var(--bg-surface);
      border-radius: 1.5rem;
      border: 1px solid var(--border-subtle);
      padding: 2.5rem;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.8),
                  0 0 0 1px rgba(59, 130, 246, 0.05) inset;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .goal-block {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: 1;
      min-width: 280px;
    }

    .goal-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .goal-fields {
      display: flex;
      gap: 0.6rem;
      flex: 1;
      flex-wrap: wrap;
    }

    .goal-fields input {
      flex: 1;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-width: 0;
    }

    .goal-fields input:focus {
      border-color: var(--blue-accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .target-input {
      max-width: 160px;
    }

    .goal-fields select {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 0.75rem;
      padding: 0.75rem 0.9rem;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .goal-fields select:focus {
      border-color: var(--blue-accent);
    }

    .goal-fields select option {
      background: var(--bg-surface);
    }

    .btn-save {
      background: var(--blue-deep);
      color: white;
      border: 1px solid var(--blue-accent);
      border-radius: 0.75rem;
      padding: 0.75rem 1.2rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: inherit;
    }

    .btn-save:hover {
      background: var(--blue-accent);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }

    .btn-save:active {
      transform: translateY(0);
    }

    .btn-save.saved {
      background: var(--success);
      border-color: var(--success);
    }

    .btn-reset {
      background: transparent;
      color: #f87171;
      border: 1px solid #7f1d1d;
      border-radius: 0.75rem;
      padding: 0.75rem 1.2rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: inherit;
    }

    .btn-reset:hover {
      background: #7f1d1d;
      color: white;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
      transform: translateY(-1px);
    }

    .btn-reset:active {
      transform: translateY(0);
    }

    .btn-reset.saved {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .target-badge {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 0.75rem;
      padding: 0.7rem 1.2rem;
      white-space: nowrap;
    }

    .target-badge span {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .target-badge strong {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--blue-bright);
      letter-spacing: -0.02em;
    }

    .progress-block {
      margin-bottom: 2rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.75rem;
    }

    .progress-header span {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .progress-header strong {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--blue-bright);
      letter-spacing: -0.02em;
    }

    .progress-track {
      height: 14px;
      background: var(--bg-elevated);
      border-radius: 100px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blue-deep) 0%, var(--blue-accent) 50%, var(--blue-bright) 100%);
      border-radius: 100px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 50%);
      border-radius: 100px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 1rem;
      padding: 1.2rem 1.4rem;
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .stat-value.accent {
      color: var(--blue-bright);
    }

    .forms {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 1rem;
      padding: 1.5rem;
    }

    .panel-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .field input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 0.6rem;
      padding: 0.75rem 1rem;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--blue-accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    .field input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 0.6rem;
      padding: 0.85rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-add {
      background: var(--blue-deep);
      color: white;
      border: 1px solid var(--blue-accent);
    }

    .btn-add:hover {
      background: var(--blue-accent);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }

    .btn-add:active {
      transform: translateY(0);
    }

    .btn-sub {
      background: transparent;
      color: #f87171;
      border: 1px solid #7f1d1d;
    }

    .btn-sub:hover {
      background: #7f1d1d;
      color: white;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
      transform: translateY(-1px);
    }

    .btn-sub:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .history-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .history-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      max-height: 340px;
    }

    .history-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-title .count {
      font-size: 0.7rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 0.15rem 0.6rem;
      border-radius: 100px;
      color: var(--text-muted);
    }

    .history-list {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding-right: 0.3rem;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }

    .history-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 100px;
    }

    .entry {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 0.6rem;
      padding: 0.75rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .entry-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .entry-amount {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .entry-amount.plus {
      color: var(--blue-bright);
    }

    .entry-amount.minus {
      color: #f87171;
    }

    .entry-time {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .entry-reason {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.4;
      word-break: break-word;
    }

    .entry-reason .label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .win-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.92);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
    }

    .win-overlay.active {
      display: flex;
      animation: overlayFade 3.2s ease forwards;
    }

    .win-box {
      text-align: center;
      animation: winPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .win-box h1 {
      font-size: 4.5rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #60a5fa, #3b82f6, #1e3a8a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .win-box p {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--blue-bright);
    }

    @keyframes overlayFade {
      0% { opacity: 0; }
      8% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes winPop {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 820px) {
      .app { padding: 1.5rem; }
      .forms, .history-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: stretch; }
      .goal-block { flex-direction: column; align-items: stretch; }
      .goal-label { display: none; }
      .target-input { max-width: none; }
      .win-box h1 { font-size: 3rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="goal-block">
        <span class="goal-label">Goal</span>
        <div class="goal-fields">
          <input type="text" id="goalName" placeholder="Goal name" value="Dream Goal">
          <input type="text" id="targetInput" class="target-input" placeholder="Target (1000 or 1000,20)" value="1000">
          <select id="currencySelector">
            <option value="€" selected>€ EUR</option>
            <option value="$">$ USD</option>
          </select>
          <button class="btn-save" id="saveGoalBtn" type="button">Save</button>
          <button class="btn-reset" id="resetBtn" type="button">Reset</button>
        </div>
      </div>
      <div class="target-badge">
        <span>Target</span>
        <strong id="targetBadge">1.000,00 €</strong>
      </div>
    </div>

    <div class="progress-block">
      <div class="progress-header">
        <span>Progress</span>
        <strong id="percentDisplay">0%</strong>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Saved</div>
        <div class="stat-value accent" id="savedDisplay">0,00 €</div>
      </div>
      <div class="stat">
        <div class="stat-label">Target</div>
        <div class="stat-value" id="targetDisplay">1.000,00 €</div>
      </div>
      <div class="stat">
        <div class="stat-label">Remaining</div>
        <div class="stat-value" id="remainingDisplay">1.000,00 €</div>
      </div>
    </div>

    <div class="forms">
      <div class="panel">
        <div class="panel-title">Add Money</div>
        <div class="field">
          <label>Amount</label>
          <input type="text" id="addAmount" placeholder="0.00 or 0,00">
        </div>
        <div class="field">
          <label>Source / Reason</label>
          <input type="text" id="addSource" placeholder="e.g. Salary, gift, refund">
        </div>
        <button class="btn btn-add" id="addBtn">Add to Goal</button>
      </div>

      <div class="panel">
        <div class="panel-title">Withdraw Money</div>
        <div class="field">
          <label>Amount</label>
          <input type="text" id="subAmount" placeholder="0.00 or 0,00">
        </div>
        <div class="field">
          <label>Reason / Purpose</label>
          <input type="text" id="subReason" placeholder="e.g. Emergency, bill, purchase">
        </div>
        <button class="btn btn-sub" id="subBtn" disabled>Withdraw</button>
      </div>
    </div>

    <div class="history-grid">
      <div class="history-panel">
        <div class="history-title">
          Deposit History
          <span class="count" id="addCount">0</span>
        </div>
        <div class="history-list" id="addList">
          <div class="empty">No deposits yet</div>
        </div>
      </div>
      <div class="history-panel">
        <div class="history-title">
          Withdraw History
          <span class="count" id="subCount">0</span>
        </div>
        <div class="history-list" id="subList">
          <div class="empty">No withdrawals yet</div>
        </div>
      </div>
    </div>
  </div>

  <div class="win-overlay" id="winOverlay">
    <div class="win-box">
      <h1>GOAL REACHED</h1>
      <p>Congratulations</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
